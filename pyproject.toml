[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "freight-invoice-reconciler"
version = "0.1.0"
description = "Deterministic three-way freight invoice reconciliation and discrepancy triage"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2,<3",
    "streamlit>=1.40,<2",
    "openai>=1.50,<2",
    "python-dotenv>=1,<2",
    "supabase>=2.10,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
